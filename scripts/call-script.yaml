# =============================================================================
#  OUTBOUND SALES CALL SCRIPT — the complete story, start to finish
# =============================================================================
#
#  This file is the ONLY thing the agent can say.
#
#  The AI never invents a line. It picks the right beat from this file for the
#  moment in the call, fills in the caller's details, and speaks it. Groq is
#  used to understand what the caller MEANT, and to say a line more naturally —
#  but every fact, price stance and promise comes from here.
#
#  Questions mid-call are answered from the FAQ at the bottom of this file. If
#  a question isn't covered, the agent says so and pivots to the demo. It does
#  not guess.
#
#  Edit freely — it's validated when the server starts, so a typo fails loudly
#  instead of mid-call. Keep lines SHORT: this is spoken, not read.
#
#  Placeholders you can use in any line:
#    {name}         caller's first name                  "Ananya"
#    {company}      caller's company                     "CityCare Hospital"
#    {ourCompany}   us (from .env COMPANY_NAME)          "Aarohi Connect"
#    {founder}      who runs the demo (.env FOUNDER_NAME) "Sachin"
#    {calls}        the calls they miss, short           "patient calls"
#    {problem}      the calls they miss, in full         "after-hours patient calls that go unanswered"
#    {consequence}  what one missed call costs them      "a patient who needed help and got a dead line"
#    {slots}        the two demo times on offer          "Thursday at 11 or Friday at 3"
#    {slot}         the time they picked                 "Thursday at 11"
#    {close}        the whole close line (for objections that end in an ask)
#    {question}     the question we're steering back to
#
#  Languages: "en" is spoken to en-US and en-IN callers; "hi" is Hinglish.
#  The Hinglish is written in masculine Hindi ("kar raha hoon") — the voices
#  are male to match. If you switch to a female voice, change the grammar too.
#
# =============================================================================


# -----------------------------------------------------------------------------
#  WHO WE'RE CALLING — how a lead becomes a story
# -----------------------------------------------------------------------------
#  The lead's industry / description picks a topic. That topic fills {calls},
#  {problem} and {consequence} everywhere below, so the same script sounds
#  like it was written for a hospital, a grocery app or a dental clinic.
#  "match" is a list of words looked for in the lead record. First hit wins;
#  "general" is the fallback.

topics:
  hospital:
    match: [hospital, patient, clinic front desk, ward]
    en:
      calls: "patient calls"
      problem: "after-hours patient calls that go unanswered"
      consequence: "a patient who needed help and got a dead line"
    hi:
      calls: "patient calls"
      problem: "raat ke patient calls jo miss ho jaate hain"
      consequence: "ek patient ko urgent madad chahiye thi aur line hi nahi lagi"

  order:
    match: [grocery, order, delivery, ecommerce, e-commerce, shipment]
    en:
      calls: "order-status calls"
      problem: "\"where is my order\" calls flooding your line"
      consequence: "a frustrated customer who doesn't order again"
    hi:
      calls: "order-status calls"
      problem: "\"order kahan hai\" wale calls jo line block karte hain"
      consequence: "customer frustrate hoke dobara order hi nahi karta"

  appointment:
    match: [dental, clinic, appointment, salon, spa, booking]
    en:
      calls: "appointment calls"
      problem: "appointment calls that never get through"
      consequence: "a patient who just books the clinic down the street"
    hi:
      calls: "appointment calls"
      problem: "appointment ke calls jo connect hi nahi hote"
      consequence: "patient bagal wali clinic mein book kar leta hai"

  general:
    match: []
    en:
      calls: "missed calls"
      problem: "calls you're probably missing right now"
      consequence: "a customer who just calls your competitor next"
    hi:
      calls: "missed calls"
      problem: "calls jo abhi miss ho rahe honge"
      consequence: "customer seedha competitor ko call kar leta hai"


# -----------------------------------------------------------------------------
#  THE CALL — five beats, in order
# -----------------------------------------------------------------------------
#  1. OPENING     say who's calling and why, ask for a minute. Then WAIT.
#  2. DISCOVERY   one question about THEIR problem. Not a menu. Then WAIT.
#  3. PITCH       acknowledge, sell the outcome (not the feature), ask for a demo.
#  4. CLOSE       offer two concrete times. Never "when works for you?"
#  5. WRAP-UP     confirm and get off the phone.
#
#  Every beat ends with a question, and the agent stops talking after it.

flow:

  # --- 1. OPENING -------------------------------------------------------------
  # Outbound cold-open. No pitch here — earn the minute first.
  opening:
    en: "Hi {name}, this is {ourCompany}'s AI assistant, calling on behalf of {founder}. It'll only take a minute — is now an okay time?"
    hi: "Namaste {name}, main {ourCompany} ka AI assistant hoon, {founder} ki taraf se call kar raha hoon. Bilkul chhota sa call hai — ek minute milega?"

  # --- 2. DISCOVERY -----------------------------------------------------------
  # The one question the whole call is built around. Specific to their business.
  discovery:
    en: "Thanks. Quick question — {question}"
    hi: "Shukriya. Ek quick sawal — {question}"

  # The bare question (also what we steer back to if they wander off).
  discovery_question:
    en: "How is {company} handling {problem} today?"
    hi: "{company} mein abhi {problem} — yeh kaise handle karte hain?"

  # --- 3. PITCH ---------------------------------------------------------------
  # Whatever they said about their process, acknowledge it, then sell what a
  # missed call COSTS them — not what the product does. End on the demo ask.
  pitch:
    en: "Got it. Every one of those calls that goes unanswered means {consequence}. {ourCompany} gives you an AI voice agent that picks up {calls} the moment they come in — want a quick demo?"
    hi: "Samajh gaya. Har baar jo call miss hoti hai, uska matlab {consequence}. {ourCompany} ek AI voice agent deta hai jo {calls} turant pick karta hai, chaahe koi available ho ya na ho. Ek chhota demo dikhaun?"

  pitch_question:
    en: "Want a quick demo?"
    hi: "Ek chhota demo dikhaun?"

  # --- 4. CLOSE ---------------------------------------------------------------
  # Alternative-choice close: two times, never an open "when?". Say what the
  # times are FOR — a real caller once asked "timing of what?".
  close:
    en: "Sure thing — let's set up a 15-minute demo with {founder}. I've got {slots}. Which works better for you?"
    hi: "Bilkul. {founder} ke saath 15 minute ka demo rakh lete hain — {slots}, aapke liye kya better rahega?"

  # They said yes but didn't pick — assume the first slot and confirm.
  confirm_slot:
    en: "So shall I lock the demo for {slot}?"
    hi: "Toh demo {slot} lock kar doon?"

  # --- 5. WRAP-UP -------------------------------------------------------------
  wrap_up_booked:
    en: "Perfect, I'll lock {slot}. {founder} will run the demo. I'll send the confirmation link. Thank you, {name}."
    hi: "Perfect, {slot} rakh dete hain. {founder} aapko demo de denge. Main confirmation link bhej deta hoon. Thank you, {name}."

  wrap_up_not_booked:
    en: "All good, no problem. Thank you, {name}."
    hi: "Theek hai, koi problem nahi. Thank you, {name}."

  # Neither offered time worked, or they named their own — don't haggle live.
  availability_captured:
    en: "All good — I'll send a calendar link and you can pick a time that suits you."
    hi: "Theek hai, calendar link bhej dunga. Aap jab free ho tab choose kar lena."


# -----------------------------------------------------------------------------
#  EXITS — how the call ends when it doesn't reach the close
# -----------------------------------------------------------------------------
#  These are spoken EXACTLY as written. The AI never rephrases an exit — a
#  "don't call me again" has to be acknowledged word-for-word.

exits:
  no_time:
    en: "Of course, no problem {name}. I won't take your time now. Thank you."
    hi: "Bilkul, koi problem nahi {name}. Abhi time nahi lunga. Thank you."

  do_not_call:
    en: "Absolutely, understood. I won't call again. Have a good day."
    hi: "Absolutely, understood. Main dobara call nahi karunga. Have a good day."

  hostile:
    en: "Understood. I won't waste your time. Thank you."
    hi: "Understood. Main aapka time waste nahi karunga. Thank you."

  wrong_person:
    en: "Looks like I have the wrong person. I'll drop off — sorry to bother you."
    hi: "Galat number lag raha hai. Main drop karta hoon — disturb karne ke liye sorry."

  silence:
    en: "Looks like a connection issue. I'll end the call here. Thank you."
    hi: "Lagta hai connection issue hai. Main call yahin end karta hoon. Thank you."


# -----------------------------------------------------------------------------
#  KEEPING THE CALL ON TRACK
# -----------------------------------------------------------------------------

steering:
  # Silence: ask once, gently. Twice → the "silence" exit above.
  nudge:
    en: "{name}, can you still hear me?"
    hi: "{name}, kya aap mujhe sun pa rahe hain?"

  # They wandered off-script: acknowledge in a breath, re-ask the question.
  hold_on_script:
    en: "Got it. {question}"
    hi: "Samajh gaya. {question}"

  # The question we're steering back to, per beat.
  anchor:
    opening:
      en: "Is now an okay time?"
      hi: "Ek minute milega?"
    default:
      en: "Yeah, go ahead."
      hi: "Haan, boliye."

  # A question we have no answer for. Say so, don't guess, pivot to the demo.
  faq_no_match:
    en: "Good question — I don't have the exact answer on that, and I won't guess. It's exactly the kind of thing {founder} walks through in the demo."
    hi: "Achha sawal hai — iska exact answer mere paas abhi nahi hai, aur main guess nahi karunga. Yeh exactly wahi cheez hai jo {founder} demo mein detail se batayenge."

  # Said the instant the caller stops talking, while the real reply is
  # generated. Short, varied, pre-recorded at startup so they're instant.
  fillers:
    en-US: ["Right, got it.", "Okay, sure.", "Mm-hmm.", "Yeah, I hear you."]
    en-IN: ["Right, got it.", "Okay, understood.", "Hmm, sure.", "Yeah, I hear you."]
    hi:    ["Haan, samajh gaya.", "Achha, theek hai.", "Hmm, bilkul.", "Ji, samajh raha hoon."]


# -----------------------------------------------------------------------------
#  OBJECTIONS — the eight things people actually say, and the comeback
# -----------------------------------------------------------------------------
#  Technique notes are in the comments. Rules the code enforces:
#   • "not interested" or "who gave you my number" twice → we wrap up. No third try.
#   • three objections total on a "not interested" → wrap up.
#   • "no time" → exit immediately. Never pitch someone who said they're busy.

objections:

  # Feel / felt / found. Reduce risk ("we stop right there"). Then close.
  not_interested:
    en: "Totally get it — a lot of people feel that way at first. But once they actually see it catch {calls} live, most change their mind fast. If a short demo isn't useful, we stop right there, no pressure. {close}"
    hi: "Bilkul samajh sakta hoon — zyada log pehle aisa hi sochte hain. Lekin jab woh demo mein live {calls} handle hote dekhte hain, zyadatar apna mind badal lete hain. Agar useful na lage toh wahin ruk jaate hain, koi pressure nahi. {close}"

  # Don't attack what they have. Reframe as a second opinion.
  already_use_competitor:
    en: "Good to know — this isn't about ripping that out. Think of it as a second opinion: we compare how it handles {calls} against what you already have. Worth a short look?"
    hi: "Achha, good to know. Yeh replace karne ki baat nahi hai — bas ek second opinion samjho. Hum compare kar sakte hain ki {calls} ko aapka current setup kitna achhe se handle karta hai. Short demo dekhna chahenge?"

  # Agree, then explain why the call is faster than the email. Close.
  send_email:
    en: "Happy to email it over. Just so you know, a 2-minute call usually explains it faster than reading — if it's not useful, feel free to ignore the email after. {close}"
    hi: "Bilkul, email kar deta hoon. Bas itna — 2 minute ka call usually padhne se fast samajh aata hai. Agar useful na laga toh email ignore kar dena. {close}"

  # Never quote a number on a cold call. Tie price to the demo.
  how_much:
    en: "It depends on your call volume, so I won't quote a random number. The demo walks through exact pricing once we've seen how many {calls} you're actually getting. {close}"
    hi: "Yeh aapke call volume par depend karta hai, isliye main random number nahi dunga. Demo mein exact pricing dikh jaayegi jab pata chalega ki kitne {calls} aate hain. {close}"

  # Always honest. Then straight back to being useful.
  is_this_ai:
    en: "Yes, I'm {ourCompany}'s AI assistant — you're talking to me right now. Ask me anything about how it works, or I can set up the demo."
    hi: "Haan, main {ourCompany} ka AI assistant hoon — aap abhi mujhse hi baat kar rahe hain. Kaise kaam karta hai pooch sakte ho, ya main demo set kar doon."

  # Busy means busy. Exit, don't negotiate.
  no_time:
    en: "Of course, no problem. I won't take your time now. Thank you."
    hi: "Bilkul, koi problem nahi. Abhi time nahi lunga. Thank you."

  # Answer plainly, offer the out. Asked twice → we wrap up.
  who_gave_number:
    en: "This is {ourCompany} calling about our voice assistant. If you'd rather I didn't contact you again, I'll stop right here."
    hi: "Yeh {ourCompany} ka call hai hamare voice assistant ke baare mein. Agar aap nahi chahte ki main dobara contact karun, toh main yahin stop karta hoon."

  # Accept it, but try to lock a time now — "later" usually means never.
  call_later:
    en: "Sure, I can call back. Or if it's easier, lock one time now — {slots}?"
    hi: "Sure, main baad mein call kar sakta hoon. Waise agar convenient ho toh {slots} mein se ek time fix kar dein?"


# -----------------------------------------------------------------------------
#  FAQ — what the agent knows about the product
# -----------------------------------------------------------------------------
#  When the caller ASKS something, the agent finds the closest entry here and
#  speaks the answer exactly as written, then the call carries on from the
#  same beat. "ask" lists the ways people phrase it — add more as you hear
#  them in real transcripts. No entry matches → "faq_no_match" above.
#
#  Keep answers to two spoken sentences. End on a bridge back to the call
#  where it fits naturally — not every time.

faq:

  - id: what_is_it
    ask:
      - what is this
      - what do you do
      - what is this about
      - what does your company do
      - tell me about the product
      - yeh kya hai
      - aap kya karte ho
      - kya product hai
      - yeh kis baare mein hai
    en: "{ourCompany} is an AI voice agent that answers your phone when nobody else can — nights, weekends, or when the line's busy. It talks to the caller, handles the routine stuff, and passes the rest to your team."
    hi: "{ourCompany} ek AI voice agent hai jo aapka phone tab uthata hai jab koi aur nahi utha sakta — raat ko, weekend pe, ya line busy ho. Caller se baat karta hai, routine cheezein khud handle karta hai, aur baaki aapki team ko de deta hai."

  - id: how_it_works
    ask:
      - how does it work
      - how does this work
      - how would it work for us
      - what happens when someone calls
      - kaise kaam karta hai
      - yeh kaise chalega
      - call aane pe kya hoga
    en: "A call comes in, the agent picks up, greets the caller by your company name, and understands what they need — like this call. It can answer common questions, take a message, or book a slot, and sends your team a summary straight after."
    hi: "Call aati hai, agent uthata hai, aapki company ke naam se greet karta hai, aur samajhta hai caller ko kya chahiye — bilkul is call ki tarah. Common sawaal answer kar sakta hai, message le sakta hai, ya slot book kar sakta hai, aur turant aapki team ko summary bhej deta hai."

  - id: languages
    ask:
      - does it speak hindi
      - which languages
      - what languages does it support
      - can it talk in hinglish
      - hindi mein baat karega
      - kaunsi languages
      - hinglish samajhta hai
    en: "It speaks Hindi, Hinglish, Indian English and US English — and it's speaking Hinglish to you right now, so you can judge for yourself. You pick the language per phone line."
    hi: "Hindi, Hinglish, Indian English aur US English — aur abhi aapse Hinglish mein hi baat kar raha hai, toh khud sun lijiye. Har phone line ke liye language aap choose karte ho."

  - id: pricing
    ask:
      - how much does it cost
      - what is the price
      - what are the plans
      - pricing
      - is it expensive
      - kitna kharcha
      - kitne ka hai
      - price kya hai
      - monthly kitna
    en: "It's priced on call volume, so I won't throw a random number at you on the phone. {founder} shows exact pricing in the demo once we know roughly how many {calls} you get."
    hi: "Pricing call volume pe hai, isliye phone pe random number nahi bolunga. Demo mein {founder} exact pricing dikhate hain jab pata chal jaaye ki roughly kitne {calls} aate hain."

  - id: integration
    ask:
      - does it work with our phone number
      - do we need to change our number
      - does it integrate with our system
      - can it work with our existing setup
      - new number lena padega
      - humare number pe chalega
      - existing system ke saath
    en: "Your number stays exactly the same. Calls forward to the agent when you're closed or busy — no new hardware, no app to install, and your team keeps using the phones they already have."
    hi: "Aapka number bilkul wahi rehta hai. Jab aap band ho ya busy ho, calls agent ko forward ho jaati hain — koi naya hardware nahi, koi app install nahi, aur team wahi phone use karti rehti hai."

  - id: handoff
    ask:
      - what if it cannot answer
      - what if it doesn't know
      - can it transfer to a person
      - can I talk to a human
      - what about complicated calls
      - agar samajh na aaye toh
      - insaan se baat karwa sakta hai
      - transfer kar sakta hai
    en: "If a caller needs something it can't handle, it takes a message and flags it to your team right away — or transfers live to a person if you want that. It never guesses on things like medical or account questions."
    hi: "Agar caller ko kuch aisa chahiye jo yeh handle nahi kar sakta, toh message leta hai aur turant aapki team ko flag karta hai — ya aap chaho toh live insaan ko transfer kar deta hai. Medical ya account jaise sawaalon pe kabhi guess nahi karta."

  - id: emergencies
    ask:
      - what about emergencies
      - what if it is urgent
      - emergency call aaye toh
      - urgent ho toh kya
    en: "Urgent calls are the whole point. It recognises when something's serious, tells the caller what to do immediately, and alerts your duty person at the same time — instead of the call ringing out."
    hi: "Urgent calls ke liye hi toh hai. Jab kuch serious ho toh pehchaan leta hai, caller ko turant batata hai kya karna hai, aur saath hi aapke duty person ko alert karta hai — line ring hoke cut hone ke bajaye."

  - id: booking
    ask:
      - can it book appointments
      - can it take orders
      - can it schedule
      - appointment book kar sakta hai
      - order le sakta hai
    en: "Yes — it can book appointments, take order details, or capture a callback time, and it confirms by SMS or WhatsApp. Exactly what it's about to do with you, in fact."
    hi: "Haan — appointment book kar sakta hai, order details le sakta hai, ya callback time note kar sakta hai, aur SMS ya WhatsApp pe confirm karta hai. Bilkul jaise abhi aapke saath karne wala hai."

  - id: setup_time
    ask:
      - how long does setup take
      - how long to get started
      - when can we start
      - setup mein kitna time
      - kab se shuru
    en: "Usually a few days. We load your details and the answers you want it to give, test it on your line, and go live. No long project."
    hi: "Usually kuch din. Aapki details aur jo answers aap dena chahte ho woh load karte hain, aapki line pe test karte hain, aur live. Koi lamba project nahi."

  - id: privacy
    ask:
      - is the data safe
      - what about privacy
      - is it secure
      - where is data stored
      - data safe hai
      - privacy ka kya
      - secure hai
    en: "Call recordings and details stay private to your account and aren't used to train anything. {founder} can walk you through exactly what's stored and for how long in the demo."
    hi: "Call recordings aur details sirf aapke account mein rehti hain aur kisi training ke liye use nahi hoti. Demo mein {founder} exactly bata sakte hain kya store hota hai aur kitne time tak."

  - id: sounds_robotic
    ask:
      - does it sound like a robot
      - will callers know it is ai
      - does it sound natural
      - robot jaisa lagega
      - log pakad lenge
    en: "You're hearing it right now — you can judge. It also tells callers up front that it's an AI assistant, and most people are just relieved someone picked up."
    hi: "Abhi aap sun hi rahe ho — khud judge kar lijiye. Yeh callers ko pehle hi bata deta hai ki AI assistant hai, aur zyadatar log bas khush hote hain ki kisi ne phone uthaya."

  - id: trial
    ask:
      - can we try it first
      - is there a trial
      - can we test it
      - pehle try kar sakte hain
      - trial hai
      - test karke dekh sakte hain
    en: "Yes — the demo itself runs on your real scenario, and if it makes sense we set it up on a single line first so you can hear real calls before committing to anything."
    hi: "Haan — demo aapke real scenario pe hi hota hai, aur agar sense bane toh pehle ek line pe lagate hain taaki commit karne se pehle aap real calls sun sako."

  - id: hours
    ask:
      - is it only after hours
      - does it work 24 hours
      - only at night
      - sirf raat ko
      - 24 ghante chalta hai
    en: "Whatever you want. Most start with after-hours and overflow — when nobody picks up within a few rings — and some run it 24/7 as the first voice on the line."
    hi: "Jaise aap chaho. Zyadatar log after-hours aur overflow se shuru karte hain — jab kuch rings mein koi nahi uthata — aur kuch 24/7 first voice ki tarah chalate hain."

  - id: who_are_you
    ask:
      - who is sachin
      - who is calling
      - which company is this
      - who are you
      - aap kaun ho
      - kaunsi company
      - sachin kaun hai
    en: "I'm {ourCompany}'s AI assistant, calling for {founder}, who runs the company. He's the one who'd walk you through the demo personally."
    hi: "Main {ourCompany} ka AI assistant hoon, {founder} ke liye call kar raha hoon — woh company chalate hain. Demo woh khud personally dete hain."

  - id: contract
    ask:
      - is there a contract
      - can we cancel anytime
      - lock in period
      - contract hai kya
      - kabhi bhi band kar sakte hain
    en: "No lock-in — it's month to month, and you can stop whenever you like. {founder} will confirm the exact terms in the demo."
    hi: "Koi lock-in nahi — month to month hai, aur jab chaho band kar sakte ho. Exact terms {founder} demo mein confirm kar denge."
